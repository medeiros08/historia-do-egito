<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aventura no Egito Antigo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap');

        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fce8bc; /* Cor de areia */
            color: #4a2b11;
            /* Previne seleção acidental de texto ao clicar nos botões */
            user-select: none;
            -webkit-user-select: none;
        }

        .bg-nile {
            background-color: #1e3a8a; /* Azul escuro Nilo */
        }
        
        .text-gold {
            color: #fbbf24; /* Amarelo dourado */
        }

        /* Animações suaves */
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Botões de opção grandes */
        .btn-opcao {
            transition: all 0.2s;
            touch-action: manipulation; /* Melhora o clique em telas touch */
        }

        .btn-opcao:active {
            transform: scale(0.95);
        }

        .btn-correct {
            background-color: #22c55e !important; /* Verde Tailwind */
            color: white !important;
            border-color: #16a34a !important;
        }

        .btn-wrong {
            background-color: #ef4444 !important; /* Vermelho Tailwind */
            color: white !important;
            border-color: #dc2626 !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Tela Inicial -->
    <div id="tela-inicial" class="w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-8 text-center border-4 border-yellow-500 fade-in">
        <h1 class="text-4xl md:text-5xl font-black mb-4 text-blue-900">🏜️ Mistérios do Egito 🐫</h1>
        <p class="text-2xl mb-8 text-gray-700">Vamos aprender sobre o Egito Antigo de forma divertida!</p>
        <button onclick="iniciarJogo()" class="w-full bg-blue-600 hover:bg-blue-700 text-white text-4xl font-bold py-6 px-8 rounded-2xl shadow-lg transform transition active:scale-95 border-b-8 border-blue-800">
            ▶️ COMEÇAR
        </button>
    </div>

    <!-- Tela do Jogo -->
    <div id="tela-jogo" class="hidden w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-6 md:p-8 border-4 border-yellow-500">
        
        <!-- Cabeçalho (Fase e Pontuação) -->
        <div class="flex justify-between items-center mb-6 bg-blue-100 p-4 rounded-xl border-2 border-blue-300">
            <h2 id="fase-titulo" class="text-2xl md:text-3xl font-bold text-blue-900">Fase 1</h2>
            <div class="text-2xl font-bold text-yellow-600 flex items-center gap-2">
                ⭐ <span id="pontuacao-texto">0</span>
            </div>
        </div>

        <!-- Pergunta -->
        <div class="mb-8 text-center">
            <h3 id="pergunta-texto" class="text-3xl md:text-4xl font-black text-gray-800 mb-6 leading-tight">
                Pergunta vai aqui?
            </h3>
        </div>

        <!-- Botões de Resposta -->
        <div id="opcoes-container" class="space-y-4 flex flex-col">
            <!-- Opções serão injetadas via JS -->
        </div>

        <!-- Mensagem de Feedback (Certo/Errado) -->
        <div id="feedback-msg" class="hidden mt-6 text-center text-2xl font-bold p-4 rounded-xl">
        </div>
    </div>

    <!-- Tela Final -->
    <div id="tela-final" class="hidden w-full max-w-2xl bg-white rounded-3xl shadow-2xl p-8 text-center border-4 border-yellow-500">
        <h1 class="text-5xl font-black mb-6 text-blue-900">Fim de Jogo! 🏆</h1>
        
        <!-- Estrelas -->
        <div id="estrelas-container" class="text-6xl md:text-8xl mb-6 flex justify-center gap-4">
            <!-- Estrelas serão injetadas aqui -->
        </div>
        
        <p id="mensagem-final" class="text-3xl text-gray-800 mb-8 font-bold">
            Você foi muito bem!
        </p>
        
        <button onclick="reiniciarJogo()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-white text-3xl md:text-4xl font-bold py-6 px-8 rounded-2xl shadow-lg transform transition active:scale-95 border-b-8 border-yellow-700">
            🔄 JOGAR DE NOVO
        </button>
    </div>

    <script>
        // --- 1. CONFIGURAÇÃO DE AUDIO (Web Audio API) ---
        // Cria um som agradável sem depender de arquivos externos
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function tocarSomAcerto() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            
            // Cria um oscilador (som) e controle de volume (gain)
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            // Som suave tipo sino (triangle/sine)
            osc.type = 'sine'; 
            
            // Nota musical (Frequência)
            const now = audioCtx.currentTime;
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.1); // Sobe o tom (plim!)
            
            // Volume e Envelope (Fade out)
            gain.gain.setValueAtTime(0.7, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            
            osc.start(now);
            osc.stop(now + 0.5);
        }

        // --- 2. BANCO DE PERGUNTAS ---
        const perguntas = [
            // FASE 1: O Rio Nilo
            {
                fase: "Fase 1: O Rio Nilo 🌊",
                pergunta: "O que o Rio Nilo trazia de bom para o Egito?",
                opcoes: [
                    { texto: "🌱 Água e terra boa para plantar", correta: true },
                    { texto: "❄️ Neve e muito gelo", correta: false }
                ]
            },
            {
                fase: "Fase 1: O Rio Nilo 🌊",
                pergunta: "Como os egípcios usavam o rio para viajar?",
                opcoes: [
                    { texto: "🚆 Andavam de trem", correta: false },
                    { texto: "⛵ Eles viajavam em barcos", correta: true }
                ]
            },
            // FASE 2: Deuses e Religião
            {
                fase: "Fase 2: Deuses e Religião 🏛️",
                pergunta: "Os antigos egípcios acreditavam em quantos deuses?",
                opcoes: [
                    { texto: "🙏 Em vários deuses diferentes", correta: true },
                    { texto: "👤 Em apenas um deus", correta: false }
                ]
            },
            {
                fase: "Fase 2: Deuses e Religião 🏛️",
                pergunta: "Qual destes animais era sagrado e protegido por eles?",
                opcoes: [
                    { texto: "🐧 O Pinguim", correta: false },
                    { texto: "🐈 O Gato", correta: true }
                ]
            },
            // FASE 3: Faraós e Pirâmides
            {
                fase: "Fase 3: Faraós e Pirâmides 🔺",
                pergunta: "Quem era o grande rei e líder do Egito Antigo?",
                opcoes: [
                    { texto: "👑 O Faraó", correta: true },
                    { texto: "👔 O Presidente", correta: false }
                ]
            },
            {
                fase: "Fase 3: Faraós e Pirâmides 🔺",
                pergunta: "Para que serviam as grandes Pirâmides?",
                opcoes: [
                    { texto: "⚽ Para jogar futebol de salão", correta: false },
                    { texto: "⚰️ Eram os túmulos dos Faraós", correta: true }
                ]
            }
        ];

        // --- 3. VARIÁVEIS DE ESTADO ---
        let indiceAtual = 0;
        let pontuacao = 0;
        let respondido = false; // Evita duplo clique

        // --- 4. FUNÇÕES DO JOGO ---
        function iniciarJogo() {
            // Inicializa áudio no primeiro clique do usuário
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            document.getElementById('tela-inicial').classList.add('hidden');
            document.getElementById('tela-jogo').classList.remove('hidden');
            document.getElementById('tela-jogo').classList.add('fade-in');
            
            indiceAtual = 0;
            pontuacao = 0;
            atualizarInterface();
            carregarPergunta();
        }

        function carregarPergunta() {
            respondido = false; // Libera os cliques
            const perguntaAtual = perguntas[indiceAtual];
            
            // Atualiza Textos
            document.getElementById('fase-titulo').innerText = perguntaAtual.fase;
            document.getElementById('pergunta-texto').innerText = perguntaAtual.pergunta;
            
            // Esconde feedback anterior
            document.getElementById('feedback-msg').classList.add('hidden');
            document.getElementById('feedback-msg').classList.remove('bg-green-100', 'text-green-800', 'border-green-400', 'bg-red-100', 'text-red-800', 'border-red-400');

            const opcoesContainer = document.getElementById('opcoes-container');
            opcoesContainer.innerHTML = ''; // Limpa botões antigos

            // Mistura as opções (opcional, mas bom para re-jogar)
            const opcoesMisturadas = [...perguntaAtual.opcoes].sort(() => Math.random() - 0.5);

            // Cria os botões de opção grandes
            opcoesMisturadas.forEach((opcao, index) => {
                const button = document.createElement('button');
                // Estilo super grande e legível
                button.className = 'btn-opcao w-full bg-white border-4 border-blue-200 text-gray-800 text-3xl md:text-4xl font-bold py-6 px-6 rounded-2xl shadow-md text-left flex items-center gap-4 hover:bg-blue-50';
                button.innerHTML = `<span>${opcao.texto}</span>`;
                
                button.onclick = () => verificarResposta(opcao, button);
                opcoesContainer.appendChild(button);
            });
        }

        function verificarResposta(opcaoEscolhida, botaoClicado) {
            if (respondido) return; // Não permite clicar mais de uma vez
            respondido = true;

            const feedback = document.getElementById('feedback-msg');
            feedback.classList.remove('hidden');

            if (opcaoEscolhida.correta) {
                // Acerto
                tocarSomAcerto();
                botaoClicado.classList.add('btn-correct');
                pontuacao++;
                atualizarInterface();
                
                feedback.innerText = "✨ Muito bem! Você acertou! ✨";
                feedback.classList.add('bg-green-100', 'text-green-800', 'border-2', 'border-green-400');
            } else {
                // Erro
                botaoClicado.classList.add('btn-wrong');
                
                feedback.innerText = "Ops! Não foi dessa vez. 😅";
                feedback.classList.add('bg-red-100', 'text-red-800', 'border-2', 'border-red-400');
            }

            // Aguarda 2 segundos e vai para a próxima
            setTimeout(() => {
                indiceAtual++;
                if (indiceAtual < perguntas.length) {
                    carregarPergunta();
                } else {
                    mostrarTelaFinal();
                }
            }, 2500); // 2.5 segundos para dar tempo de ler o feedback calmamente
        }

        function atualizarInterface() {
            document.getElementById('pontuacao-texto').innerText = pontuacao;
        }

        function mostrarTelaFinal() {
            document.getElementById('tela-jogo').classList.add('hidden');
            const telaFinal = document.getElementById('tela-final');
            telaFinal.classList.remove('hidden');
            telaFinal.classList.add('fade-in');

            const estrelasContainer = document.getElementById('estrelas-container');
            const mensagem = document.getElementById('mensagem-final');
            
            estrelasContainer.innerHTML = ''; // limpa estrelas

            let numEstrelas = 1;
            if (pontuacao >= 5) {
                numEstrelas = 3;
                mensagem.innerText = "Fantástico! Você é um verdadeiro Faraó do conhecimento! 👑";
            } else if (pontuacao >= 3) {
                numEstrelas = 2;
                mensagem.innerText = "Muito bom! Você já sabe muito sobre o Egito! 🐫";
            } else {
                numEstrelas = 1;
                mensagem.innerText = "Continue estudando! O Egito tem muitos mistérios! 📜";
            }

            // Desenha as estrelas animadas
            for (let i = 0; i < 3; i++) {
                const span = document.createElement('span');
                span.innerText = i < numEstrelas ? '⭐' : '🌑'; // Estrela brilhante ou apagada
                span.className = 'transition-transform transform hover:scale-110';
                // Adiciona um pequeno delay na animação para ficar bonito
                span.style.animation = `fadeIn 0.5s ease-in-out ${i * 0.2}s both`;
                estrelasContainer.appendChild(span);
            }
        }

        function reiniciarJogo() {
            document.getElementById('tela-final').classList.add('hidden');
            iniciarJogo();
        }
    </script>
</body>
</html>
